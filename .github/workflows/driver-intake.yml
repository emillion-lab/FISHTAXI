name: driver-intake
# Нов или променен шофьор → профил → data/drivers.json (новият сайт) + classic.html (старият).
# Виж drivers/README.md.
on:
  workflow_dispatch:
    inputs:
      edit_phone:
        description: 'Само от „Моят профил“: телефон на шофьора'
        required: false
        default: ''
      edit_json:
        description: 'Само от „Моят профил“: промените (JSON)'
        required: false
        default: ''
  push:
    branches: [ main ]
    # само текстът пуска приема: снимките (много качвания) идват преди него.
    # Ако шофьор чака снимки — качи липсващото и пусни ръчно (workflow_dispatch).
    paths:
      - 'drivers/inbox/*.txt'
      - 'drivers/profiles/**'
      - 'scripts/driver_intake.py'
      - 'scripts/driver_photos.py'
      - 'scripts/build_drivers.py'
      - '.github/workflows/driver-intake.yml'

# Без това два run-а наведнъж се блъскат при commit-а.
concurrency:
  group: driver-intake
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow

      - name: Редакция от шофьор (Моят профил)
        if: ${{ inputs.edit_phone != '' }}
        env:
          EDIT_PHONE: ${{ inputs.edit_phone }}
          EDIT_JSON: ${{ inputs.edit_json }}
        run: |
          echo "== driver-edit $(date -u)" > /tmp/intake.log
          python scripts/driver_edit.py "$EDIT_PHONE" "$EDIT_JSON" 2>&1 | tee -a /tmp/intake.log
          exit ${PIPESTATUS[0]}

      - name: Inbox → профили
        run: |
          echo "== driver-intake $(date -u)" >> /tmp/intake.log
          python scripts/driver_intake.py 2>&1 | tee -a /tmp/intake.log
          exit ${PIPESTATUS[0]}

      - name: Профили → data/drivers.json и classic.html
        run: |
          python scripts/build_drivers.py 2>&1 | tee -a /tmp/intake.log
          exit ${PIPESTATUS[0]}

      - name: Проверка на JS
        run: |
          for f in index.html classic.html; do
            [ -f "$f" ] || continue
            python - "$f" <<'PY'
          import io, re, sys
          s = io.open(sys.argv[1], encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', s, re.S)
          io.open('/tmp/bundle.js', 'w', encoding='utf-8').write('\n;\n'.join(blocks))
          PY
            node --check /tmp/bundle.js 2>&1 | tee -a /tmp/intake.log
            [ ${PIPESTATUS[0]} = 0 ] || exit 1
          done
          python -c "import json,io; json.load(io.open('data/drivers.json', encoding='utf-8'))"

      - name: Commit
        run: |
          exec > >(tee -a /tmp/intake.log) 2>&1
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- drivers img index.html data/drivers.json
          [ -f classic.html ] && git add -A -- classic.html
          if git diff --cached --quiet; then echo "без промяна"; exit 0; fi
          who=$(git diff --cached --name-only -- drivers/reports drivers/profiles | sed 's#.*/##; s/\.[a-z]*$//' | sort -u | paste -sd, -)
          git commit -q -m "шофьори: ${who:-сглобяване}"
          for i in 1 2 3; do
            git pull -q --rebase --autostash && git push -q && echo "качено" && exit 0
            sleep $((i * 5))
          done
          exit 1

      # Логът и при провал — чете се от телефон.
      - name: Лог
        if: always()
        run: |
          echo "== резултат: ${{ job.status }}" >> /tmp/intake.log
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash -u -q || true
          cp /tmp/intake.log drivers/intake.log
          git add drivers/intake.log
          git commit -q -m "driver-intake.log [skip ci]" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
