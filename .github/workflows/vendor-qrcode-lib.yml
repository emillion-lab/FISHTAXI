name: vendor-qrcode-lib

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download qrcode.min.js from npm
        run: |
          mkdir -p vendor
          curl -sSL -o /tmp/qr.tgz https://registry.npmjs.org/qrcodejs/-/qrcodejs-1.0.0.tgz
          tar xzf /tmp/qr.tgz -C /tmp
          cp /tmp/package/qrcode.min.js vendor/qrcode.min.js
          ls -l vendor/qrcode.min.js

      - name: Verify library integrity
        run: |
          test -s vendor/qrcode.min.js || { echo "empty file"; exit 1; }
          grep -q 'var QRCode' vendor/qrcode.min.js || { echo "QRCode missing"; exit 1; }
          grep -q 'CorrectLevel' vendor/qrcode.min.js || { echo "CorrectLevel missing"; exit 1; }
          node --check vendor/qrcode.min.js
          SIZE=$(wc -c < vendor/qrcode.min.js)
          echo "size: $SIZE bytes"
          [ "$SIZE" -gt 15000 ] || { echo "suspiciously small"; exit 1; }
          echo "LIBRARY OK"

      - name: Point index.html at the local copy
        run: |
          python3 - <<'PY'
          import io
          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          OLD = '<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>'
          NEW = '<script src="vendor/qrcode.min.js"></script>'
          if OLD in s:
              s = s.replace(OLD, NEW, 1)
              io.open(p, 'w', encoding='utf-8').write(s)
              print("switched to local vendor copy")
          elif NEW in s:
              print("already local")
          else:
              raise SystemExit("script tag not found")
          PY

      - name: Rename QR hint to "QR vCard"
        run: |
          python3 - <<'PY'
          import io, re
          p = 'index.html'
          s = io.open(p, encoding='utf-8').read()
          m = re.search(r'(<span id="m-qr-hint">)([^<]*)(</span>)', s)
          if not m:
              raise SystemExit("hint span not found")
          if m.group(2) == 'QR vCard':
              print("hint already correct")
          else:
              s = s[:m.start(2)] + 'QR vCard' + s[m.end(2):]
              io.open(p, 'w', encoding='utf-8').write(s)
              print("hint renamed:", m.group(2), "-> QR vCard")
          PY

      - name: Sanity check inline JS
        run: |
          python3 - "index.html" <<'PY'
          import io, re, sys
          s = io.open(sys.argv[1], encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', s, re.S)
          io.open('/tmp/bundle.js', 'w', encoding='utf-8').write('\n;\n'.join(blocks))
          print('script blocks:', len(blocks))
          PY
          node --check /tmp/bundle.js
          echo "SYNTAX OK"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vendor/qrcode.min.js index.html
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "fix(qr): vendor qrcode lib locally (CDN was not loading); rename hint to 'QR vCard'"
            git fetch origin main && git rebase origin/main || git rebase --abort
            git push
          fi
