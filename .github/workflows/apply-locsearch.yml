name: apply-locsearch-patch
# BUMP 1

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_locsearch.py'
      - '.github/workflows/apply-locsearch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/patch_locsearch.py

      - name: Sanity check inline JS
        run: |
          python3 - <<'PY'
          import io, re
          s = io.open('index.html', encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', s, re.S)
          io.open('/tmp/bundle.js', 'w', encoding='utf-8').write('\n;\n'.join(blocks))
          print('script blocks:', len(blocks))
          PY
          node --check /tmp/bundle.js
          echo "SYNTAX OK"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "no change"
          else
            git add index.html
            git commit -m "feat(order): live place search (Photon + Nominatim + Sofia POI) & bigger from/to labels"
            git push
          fi
