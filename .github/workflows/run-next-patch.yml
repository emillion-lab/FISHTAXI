name: run-next-patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch_next.py
      - name: Syntax check
        run: |
          for f in lib/*.js; do node --check $f; done
          python3 -c "import json;json.load(open('data/drivers.json'));json.load(open('.well-known/assetlinks.json'))"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A lib index.html data drivers classic.html next .well-known
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "patch_next: assetlinks с ключа от Google Play"
          git pull --rebase origin main || true
          git push
