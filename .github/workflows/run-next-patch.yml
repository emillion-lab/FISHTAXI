name: run-next-patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch_next.py
      - name: Syntax check
        run: |
          for f in lib/*.js; do node --check $f; done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A lib index.html
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "patch_next: дълги маршрути, 3 опции, часове и минути"
          git pull --rebase origin main || true
          git push
