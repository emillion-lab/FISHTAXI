name: apply-driver-card-qr

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/patch_driver_card_qr.py

      - name: Sanity check inline JS
        run: |
          python3 - "index.html" <<'PY'
          import io, re, sys
          s = io.open(sys.argv[1], encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', s, re.S)
          io.open('/tmp/bundle.js', 'w', encoding='utf-8').write('\n;\n'.join(blocks))
          print('script blocks:', len(blocks))
          PY
          node --check /tmp/bundle.js || exit 1
          echo "SYNTAX OK"

      - name: Verify
        run: |
          python3 - <<'PY'
          import io
          s = io.open('index.html', encoding='utf-8').read()
          checks = {
            'QR library':          'qrcodejs' in s,
            'QR slot':             'id="m-qr"' in s,
            'driverCardUrl':       'function driverCardUrl' in s,
            'openFromHash':        'function openFromHash' in s,
            'boot hook':           'setTimeout(openFromHash,350)' in s,
            'pax bugfix':          'buildPaxOptions(cur);' in s,
            'copy link button':    'id="m-copylink"' in s,
          }
          for k, v in checks.items():
              print(('OK  ' if v else 'FAIL'), k)
              assert v, k
          print("ALL CHECKS PASSED")
          PY

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "no change"
          else
            git add index.html
            git commit -m "feat(card): per-driver deep link + QR next to avatar; fix buildPaxOptions arg bug"
            git fetch origin main && git rebase origin/main || git rebase --abort
            git push
          fi
