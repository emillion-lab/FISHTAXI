name: apply-m3-tokens-patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-m3-tokens-patch.yml'
      - 'patches/m3-tokens.patch'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Провери дали вече е приложен
        id: check
        run: |
          if grep -q "\-\-gr:#2f7d4f" next/index.html; then
            echo "already=1" >> "$GITHUB_OUTPUT"
          else
            echo "already=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Приложи патча
        if: steps.check.outputs.already == '0'
        run: patch next/index.html < patches/m3-tokens.patch

      - name: Извади и провери JS синтаксиса на inline скрипта
        if: steps.check.outputs.already == '0'
        run: |
          python3 -c "
          import re
          s = open('next/index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          main = max(scripts, key=len)
          open('_check.js', 'w', encoding='utf-8').write(main)
          "
          node --check _check.js && echo "JS OK"

      - name: Провери баланса на div таговете
        if: steps.check.outputs.already == '0'
        run: |
          python3 -c "
          import re
          s = open('next/index.html', encoding='utf-8').read()
          o = len(re.findall(r'<div', s))
          c = len(re.findall(r'</div>', s))
          assert o == c, f'div mismatch: {o} open vs {c} close'
          print(f'div баланс ОК: {o}/{c}')
          "

      - name: Commit
        if: steps.check.outputs.already == '0'
        run: |
          rm -f _check.js
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add next/index.html
          git commit -m "next/index.html: приглушена М3 tonal палитра вместо 7-цветна дъга"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then
              echo "качено от опит $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
