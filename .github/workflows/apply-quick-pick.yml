name: apply-quick-pick

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch_quick_pick.py
      - name: Syntax check
        run: |
          for f in lib/app-fs.js lib/app-core.js lib/app-ui.js lib/app-route.js; do node --check $f; done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A lib index.html
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "бърза поръчка: списък за избор на шофьор; цял екран веднъж; заглавие без 'няма свободен'"
          git pull --rebase origin main || true
          git push
