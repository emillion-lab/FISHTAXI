name: apply-emil-gpsid

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/patch_emil_gpsid.py

      - name: Sanity check inline JS
        run: |
          python3 - "index.html" <<'PY'
          import io, re, sys
          s = io.open(sys.argv[1], encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', s, re.S)
          io.open('/tmp/bundle.js', 'w', encoding='utf-8').write('\n;\n'.join(blocks))
          print(sys.argv[1], 'script blocks:', len(blocks))
          PY
          node --check /tmp/bundle.js || exit 1
          echo "SYNTAX OK"

      - name: Verify
        run: |
          grep -q '"gps_id":"359878592888"' index.html || { echo "липсва gps_id за Emil"; exit 1; }
          # точно два gps_id-а: Emil (888) и Petar (448)
          COUNT=$(grep -o '"gps_id":"[0-9]*"' index.html | wc -l)
          echo "gps_id полета: $COUNT"
          [ "$COUNT" -eq 2 ] || { echo "очаквам 2 gps_id (Emil+Petar), намерих $COUNT"; exit 1; }
          echo "CLEAN"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "no change"
          else
            git add index.html
            git commit -m "fix(gps): Emil gps_id=359878592888 — profile matches live GPS record, no more offline-in-center"
            git fetch origin main && git rebase origin/main || git rebase --abort
            git push
          fi
