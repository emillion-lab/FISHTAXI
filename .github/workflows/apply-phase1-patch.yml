name: apply-phase1-patch
on: workflow_dispatch

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Приложи патча
        run: |
          patch index.html < patches/phase1-design.patch

      - name: Извади и провери JS синтаксиса на inline скрипта
        run: |
          python3 - <<'EOF'
          import re
          s = open('index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          # най-дългият <script> блок е основната логика; leaflet и console.log са тривиални
          main = max(scripts, key=len)
          open('_check.js', 'w', encoding='utf-8').write(main)
          EOF
          node --check _check.js && echo "JS OK"

      - name: Провери баланса на div таговете
        run: |
          python3 - <<'EOF'
          import re
          s = open('index.html', encoding='utf-8').read()
          o = len(re.findall(r'<div', s))
          c = len(re.findall(r'</div>', s))
          assert o == c, f"div mismatch: {o} open vs {c} close"
          print(f"div баланс ОК: {o}/{c}")
          EOF

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Phase 1: шрифт, нощен неон/стъкло, spotlight цикъл, еднократен зум на картата, обогатени чипове"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then
              echo "качено от опит $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
