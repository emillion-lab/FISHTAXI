name: apply-lancelot-driver

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/patch_add_lancelot.py

      - name: Sanity check inline JS
        run: |
          python3 - "index.html" <<'PY'
          import io, re, sys
          s = io.open(sys.argv[1], encoding='utf-8').read()
          blocks = re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>', s, re.S)
          io.open('/tmp/bundle.js', 'w', encoding='utf-8').write('\n;\n'.join(blocks))
          print(sys.argv[1], 'script blocks:', len(blocks))
          PY
          node --check /tmp/bundle.js || exit 1
          echo "SYNTAX OK"

      - name: Verify
        run: |
          grep -q '"gps_id":"33749132090"' index.html || { echo "липсва gps_id за Lancelot"; exit 1; }
          COUNT=$(grep -o '"gps_id":"[0-9]*"' index.html | wc -l)
          echo "gps_id полета: $COUNT"
          [ "$COUNT" -eq 3 ] || { echo "очаквам 3 gps_id (Emil+Petar+Lancelot), намерих $COUNT"; exit 1; }
          echo "CLEAN"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "no change"
          else
            git add index.html
            git commit -m "feat(drivers): add Lancelot Transfers (Saint-Tropez) as driver #3"
            git fetch origin main && git rebase origin/main || git rebase --abort
            git push
          fi
