name: assemble-b64-images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install pillow

      - name: Assemble and verify images
        run: python3 scripts/assemble_b64_images.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "no change"
          else
            git add -A img/
            git commit -m "chore(img): assemble images from base64 chunks"
            git fetch origin main && git rebase origin/main || git rebase --abort
            git push
          fi
