name: fork-next
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fork-next.yml'

permissions:
  contents: write

jobs:
  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Генерирай next/index.html от index.html
        run: |
          python3 - <<'PYEOF'
          import pathlib

          s = open('index.html', encoding='utf-8').read()
          assert '</head>' in s, 'няма </head>'

          # 1) изолиран localStorage (същият origin, различен префикс)
          s = s.replace('localStorage', '__nextLS')

          # 2) service worker изключен в /next/
          s = s.replace('navigator.serviceWorker', 'window.__nextNoSW')

          shim = """
<base href="/">
<meta name="robots" content="noindex">
<script>
(function(){
  var P = 'next:';
  window.__nextLS = {
    getItem:    function(k){ return localStorage.getItem(P + k); },
    setItem:    function(k, v){ return localStorage.setItem(P + k, v); },
    removeItem: function(k){ return localStorage.removeItem(P + k); },
    key:        function(){ return null; },
    length:     0,
    clear:      function(){
      Object.keys(localStorage)
        .filter(function(k){ return k.indexOf(P) === 0; })
        .forEach(function(k){ localStorage.removeItem(k); });
    }
  };
  window.__nextNoSW = {
    register:         function(){ return Promise.reject(new Error('SW off in /next/')); },
    ready:            new Promise(function(){}),
    getRegistrations: function(){ return Promise.resolve([]); },
    addEventListener: function(){}
  };
  if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){ if (r.scope.indexOf('/next/') > -1) r.unregister(); });
    }).catch(function(){});
  }
})();
</script>
"""
          s = s.replace('</head>', shim + '</head>', 1)

          pathlib.Path('next').mkdir(exist_ok=True)
          open('next/index.html', 'w', encoding='utf-8').write(s)
          print('next/index.html: %d bytes' % len(s))
          PYEOF

      - name: Провери JS синтаксиса на inline скрипта
        run: |
          python3 - <<'PYEOF'
          import re
          s = open('next/index.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          main = max(scripts, key=len)
          open('_check.js', 'w', encoding='utf-8').write(main)
          PYEOF
          node --check _check.js && echo "JS OK"

      - name: Провери баланса на div таговете
        run: |
          python3 - <<'PYEOF'
          import re
          s = open('next/index.html', encoding='utf-8').read()
          o = len(re.findall(r'<div', s))
          c = len(re.findall(r'</div>', s))
          assert o == c, f"div mismatch: {o} open vs {c} close"
          print(f"div баланс ОК: {o}/{c}")
          PYEOF

      - name: Commit
        run: |
          rm -f _check.js
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add next/index.html
          if git diff --cached --quiet; then
            echo "няма промяна"
            exit 0
          fi
          git commit -m "fork-next: регенерирано next/index.html от index.html"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then
              echo "качено от опит $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
