name: fork-next
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fork-next.yml'
      - 'scripts/fork_next.py'

permissions:
  contents: write

jobs:
  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Генерирай next/index.html и провери
        run: python3 scripts/fork_next.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add next/index.html
          if git diff --cached --quiet; then
            echo "няма промяна"
            exit 0
          fi
          git commit -m "fork-next: регенерирано next/index.html от index.html"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then
              echo "качено от опит $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
