name: fix-commission-range

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct the commission range in the dictionary
        run: python3 scripts/patch_commission_range.py

      - name: Regenerate lib/join-i18n.js
        run: |
          python3 scripts/gen_join_i18n.py > lib/join-i18n.js
          node --check lib/join-i18n.js
          echo "size: $(wc -c < lib/join-i18n.js) bytes"

      - name: Every language must state 20-40
        run: |
          node -e "
            const fs=require('fs');
            global.navigator={language:'en'};
            global.localStorage={getItem:()=>null,setItem:()=>{}};
            global.document={documentElement:{},getElementById:()=>null,
              addEventListener:()=>{},createElement:()=>({})};
            (0,eval)(fs.readFileSync('lib/join-i18n.js','utf8'));
            let bad=0;
            JLANGS.forEach(l=>{
              const p=JT[l].p||'';
              const ok = /20[^0-9]{1,3}40/.test(p);
              if(!ok){ console.log('FAIL',l,'->',p.slice(0,70)); bad++; }
              else console.log('OK  ',l);
              if(/20[^0-9]{1,3}25/.test(p)){ console.log('FAIL',l,'still says 25'); bad++; }
            });
            if(bad){ console.log(bad+' problem(s)'); process.exit(1); }
            console.log('ALL LANGUAGES UPDATED TO 20-40%');
          "

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_join_i18n.py lib/join-i18n.js
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "fix(join): commission is 20-40%, highest on short rides"
            git fetch origin main && git rebase origin/main || git rebase --abort
            git push
          fi
