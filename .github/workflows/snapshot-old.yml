name: snapshot-old
# Прави копие на текущия index.html като indexOLD.html.
# Тригерът е push на самия файл, за да може да се пусне при нужда:
# достатъчно е да се смени числото в BUMP отдолу и да се качи пак.
# BUMP: 1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/snapshot-old.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Копирай index.html като indexOLD.html
        run: |
          if [ ! -f index.html ]; then
            echo "index.html липсва — спирам"
            exit 1
          fi
          cp index.html indexOLD.html
          echo "Размер на копието: $(wc -c < indexOLD.html) байта"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indexOLD.html
          if git diff --cached --quiet; then
            echo "няма промяна — копието вече е актуално"
            exit 0
          fi
          git commit -m "snapshot: запазено копие на живия index.html преди редизайна"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then
              echo "качено от опит $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1
