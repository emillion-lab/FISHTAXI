name: apply-design-preview

# 1. Презарежда next/index.html от живия index.html
# 2. Прилага M3 основата
# 3. Пренарежда панела: поръчката нагоре, справочното сгънато
# 4. Слага номер на версията в заглавието, за да се вижда кое е заредено
#
# Живият сайт не се пипа. Преглед: https://fish.taxi/next/

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Презареди прегледа от живия файл
        run: python3 scripts/fork_next.py

      - name: M3 основа
        run: python3 scripts/patch_design.py next/index.html

      - name: Пренареждане на панела
        run: python3 scripts/patch_reorder.py next/index.html

      - name: Отпечатък на версията
        run: |
          STAMP="preview $(date -u +%Y-%m-%d\ %H:%M) UTC"
          python3 - "$STAMP" <<'PY'
          import io, sys
          stamp = sys.argv[1]
          p = 'next/index.html'
          s = io.open(p, encoding='utf-8').read()
          s = s.replace('</title>', ' [' + stamp + ']</title>', 1)
          io.open(p, 'w', encoding='utf-8').write(s)
          print(stamp)
          PY

      - name: Провери целостта
        run: python3 scripts/verify_page.py next/index.html /tmp/inline.js

      - name: Провери JavaScript синтаксиса
        run: node --check /tmp/inline.js && echo "JS SYNTAX OK"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add next/index.html
          if git diff --cached --quiet; then
            echo "няма промяна"
            exit 0
          fi
          git commit -m "design: M3 + пренареден панел върху прегледа"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then
              echo "качено от опит $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: Къде да гледам
        run: echo "Отвори с нов адрес, за да минеш кеша https://fish.taxi/next/?v=4"
