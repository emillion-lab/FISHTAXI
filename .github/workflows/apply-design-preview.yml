name: apply-design-preview

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Приложи патча върху прегледа
        run: python3 scripts/patch_design.py next/index.html

      - name: Провери целостта
        run: python3 scripts/verify_page.py next/index.html /tmp/inline.js

      - name: Провери JavaScript синтаксиса
        run: node --check /tmp/inline.js && echo "JS SYNTAX OK"

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add next/index.html
          if git diff --cached --quiet; then
            echo "няма промяна"
            exit 0
          fi
          git commit -m "design: редизайн v1 приложен върху прегледа"
          for i in 1 2 3; do
            git pull --rebase --autostash || true
            if git push; then
              echo "качено от опит $i"
              exit 0
            fi
            sleep $((i * 5))
          done
          exit 1

      - name: Къде да гледам
        run: echo "Преглед след 2-5 минути https://fish.taxi/next/"
